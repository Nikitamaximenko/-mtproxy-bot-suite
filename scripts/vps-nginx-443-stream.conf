# Host nginx stream: один порт 443 для klodbot (HTTPS) и Frosty VPN (Reality SNI).
# Подключить в /etc/nginx/nginx.conf:
#   stream { include /etc/nginx/conf.d-stream/*.conf; }
#
# klodbot docker: "127.0.0.1:18443:443" вместо "443:443"
# XRAY_CLIENT_PORT=443 в /opt/frostyvpn/backend/.env (xray слушает 10443, снаружи 443)

map $ssl_preread_server_name $frosty_stream_backend {
    www.microsoft.com 127.0.0.1:10443;
    default           127.0.0.1:18443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_connect_timeout 10s;
    proxy_timeout 24h;
    proxy_pass $frosty_stream_backend;
}
