# УСТАРЕЛО (klodbot переехал). Не включать stream на 443 — xray Frosty слушает 443 напрямую.
# Было: публичный 443 — klodbot (SNI). Frosty VPN — :10443.
#
#   VPN (Happ)     → 138.124.80.97:10443  → xray
#   klodbot HTTPS  → 138.124.80.97:443    → nginx stream → 127.0.0.1:18443

map $ssl_preread_server_name $frosty_stream_backend {
    klod.store          127.0.0.1:18443;
    www.klod.store      127.0.0.1:18443;
    default             127.0.0.1:18443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_connect_timeout 10s;
    proxy_timeout 24h;
    proxy_pass $frosty_stream_backend;
}
